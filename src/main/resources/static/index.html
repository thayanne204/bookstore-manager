<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tecnoteca</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="hero">
    <div class="hero-text">
      <h1>Tecnoteca</h1>
      <p>Cadastre livros e clientes, registre vendas e acompanhe o estoque da Tecnoteca.</p>
      <a class="link" href="/swagger-ui/index.html" target="_blank" rel="noopener">Abrir documentação da API</a>
    </div>
    <img class="hero-img" src="img/bita.jpg" alt="Fada tecnológica com asas luminosas segurando um cubo de luz">
  </header>

  <nav class="tabs" id="tabs" aria-label="Seções">
    <button data-tab="livros" class="on">Livros</button>
    <button data-tab="vendas">Vendas</button>
    <button data-tab="clientes">Clientes</button>
    <button data-tab="categorias">Categorias</button>
    <button data-tab="editoras">Editoras</button>
  </nav>

  <main id="app"></main>
  <div id="aviso" role="status" aria-live="polite"></div>
  <script src="js/app.js"></script>
</body>
</html>
