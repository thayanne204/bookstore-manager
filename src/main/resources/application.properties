spring.application.name=bookstore-manager

# Conexao com MySQL (os valores apos ":" sao apenas o padrao local).
# A senha NAO fica no repositorio: informe por variavel de ambiente (DB_PASSWORD)
# ou no arquivo application-local.properties (veja application-local.properties.example).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore_manager?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Arquivo local opcional (ignorado pelo Git) para sobrescrever usuario/senha do banco
spring.config.import=optional:file:./application-local.properties

# Cria as tabelas automaticamente na primeira execucao (script idempotente: CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always
spring.sql.init.schema-locations=file:./docs/schema.sql

# Configuracao JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Porta da aplicacao
server.port=8080
