# Perfil H2: banco em memoria, sem senha e sem MySQL. Os dados somem ao fechar a aplicacao.
# Uso: .\mvnw spring-boot:run "-Dspring-boot.run.profiles=h2"
spring.datasource.url=jdbc:h2:mem:bookstore_manager;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# O Hibernate cria as tabelas a partir das entidades (o schema.sql e so para MySQL)
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
